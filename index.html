<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FootballVision computer-vision football analytics demo.">
    <title>FootballVision — Demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101712;
        color: #eef5ee;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #214c2e 0%, #101712 52%);
      }
      main {
        width: min(1120px, calc(100% - 32px));
        padding: 48px 0;
      }
      .eyebrow {
        margin: 0 0 12px;
        color: #8ee5a8;
        font-size: .78rem;
        font-weight: 750;
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: clamp(2rem, 5vw, 4rem); }
      .lede { max-width: 48rem; color: #c5d4c7; line-height: 1.6; }
      video {
        display: block;
        width: 100%;
        margin: 28px 0 18px;
        border: 1px solid #477451;
        border-radius: 14px;
        background: #000;
        box-shadow: 0 24px 70px rgba(0, 0, 0, .38);
      }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; }
      a {
        display: inline-block;
        padding: .75rem 1rem;
        border-radius: .6rem;
        background: #5de17a;
        color: #071009;
        font-weight: 750;
        text-decoration: none;
      }
      a.secondary { background: #25372a; color: #eef5ee; }
      footer { margin-top: 28px; color: #a9b9ab; font-size: .9rem; }
      footer a { padding: 0; background: none; color: #8ee5a8; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Computer vision · football analytics</p>
      <h1>FootballVision demo</h1>
      <p class="lede">
        Detection, multi-object tracking, team grouping, and homography-based
        pitch mapping on a broadcast football clip.
      </p>

      <video controls preload="metadata">
        <source src="outputs/Video%20Project%202%20%282%29.mp4" type="video/mp4">
        Your browser does not support HTML5 video. Use the download link below.
      </video>

      <div class="actions">
        <a href="outputs/Video%20Project%202%20%282%29.mp4" download>Download MP4</a>
        <a class="secondary" href="https://github.com/anishh3/footballvision">View repository</a>
      </div>

      <footer>
        See the project <a href="https://github.com/anishh3/footballvision">README</a>
        for datasets, methodology, results, and limitations.
      </footer>
    </main>
  </body>
</html>
